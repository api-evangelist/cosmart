aid: cosmart
name: Cosmart
description: Cosmart is an Indonesian membership-only B2B e-commerce and procurement
  platform, founded in 2021 by Alvin Kumarga and Robert Tan, where members (individuals
  and SMEs) purchase their recurring daily and business needs in larger quantities
  at competitive prices. The platform lists over 100,000 products across categories
  including office supplies, electronics, household items, automotive parts, industrial
  equipment, furniture, and services, with nationwide delivery, flexible payment terms,
  and dedicated relationship managers for corporate clients. Backed by Lightspeed
  Venture Partners and Lightspeed India Partners. Cosmart does not publish a public
  developer program, API, or SDKs; this profile captures its identity and public web
  properties for the API Evangelist network.
